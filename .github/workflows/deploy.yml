name: Moabogo Multi-Env CI/CD Pipeline

on:
  push:
    branches: [ "dev", "stg", "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.AUTH_PAT_TOKEN || secrets.GITHUB_TOKEN || secrets.GHCR_TOKEN}}

      - name: Determine Tag
        id: tagger
        run: |
          # GHCR 패키지 경로는 소문자 필수 (대문자 포함 시 build-push 에러 방지)
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.ref_name }}" == "main" ]; then
            TAG="latest"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=ghcr.io/${OWNER_LOWER}/moabogo:${TAG}" >> $GITHUB_OUTPUT

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tagger.outputs.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Trigger Instant Watchtower Deployment
        run: |
          curl -X POST \
               -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
               https://wt.moabogo.com/v1/update
